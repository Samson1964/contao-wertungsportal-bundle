# Öffentliche Schnittstelle des Wertungsportals.
#
# Bewusst unterhalb eines eigenen Präfixes, damit die Adresse nicht mit einer
# Contao-Seite kollidieren kann. Geladen wird die Datei über das
# ContaoManager-Plugin (RoutingPluginInterface).
wertungsportal_api_vereinsliste:
    path: /wertungsportal-api/vereinsliste
    methods: [GET]
    defaults:
        _controller: Schachbulle\ContaoWertungsportalBundle\Controller\VereinslisteController
        _scope: frontend
        _token_check: false

# Reklamationsformular (ab 1.51.0). Im Frontend-Bereich, damit die Anmeldung
# des Mitglieds zur Verfügung steht, und MIT Tokenprüfung: Contao weist ein
# Absenden ohne gültiges REQUEST_TOKEN ab, bevor der Controller läuft
wertungsportal_reklamation:
    path: /wertungsportal-api/reklamation
    methods: [POST]
    defaults:
        _controller: Schachbulle\ContaoWertungsportalBundle\Controller\ReklamationController
        _scope: frontend
        _token_check: true

# Änderungsmeldungen „Foto ändern" und „Logo/Infos ändern" (ab 1.54.0), mit
# Dateianhang. Wie die Reklamation: Frontend-Bereich für die Anmeldung des
# Mitglieds und Tokenprüfung
wertungsportal_aenderung:
    path: /wertungsportal-api/aenderung
    methods: [POST]
    defaults:
        _controller: Schachbulle\ContaoWertungsportalBundle\Controller\AenderungController
        _scope: frontend
        _token_check: true
