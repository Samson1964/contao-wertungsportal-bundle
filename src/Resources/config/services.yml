services:
    # Öffentliche Schnittstelle für Vereinslisten (Route in routing.yml).
    # Muß öffentlich sein, damit der Router den Controller auflösen kann
    Schachbulle\ContaoWertungsportalBundle\Controller\VereinslisteController:
        public: true
        arguments:
            - '@contao.framework'

    # Nächtlicher Cronjob: lädt Turnierdaten der letzten Wochen vor, damit
    # nicht jeder erste Besucher auf die Schnittstelle warten muss.
    # Alle 10 Minuten zwischen 1 und 3 Uhr; jeder Lauf macht dort weiter, wo
    # der vorige aufgehört hat. Der Lauf um 3:00 ist der letzte der Nacht —
    # die Termine bis 3:50 lehnt die Klasse selbst ab (STUNDE_ENDE).
    # Der Takt passt zum Zeitbudget: 180 Sekunden Arbeit, dann gut sieben
    # Minuten Ruhe, bevor der nächste Lauf beginnt.
    # ACHTUNG: Ohne einen echten Cronjob beim Hoster (contao:cron alle 10
    # Minuten) löst nur ein Seitenaufruf den Termin aus — dann bleibt es
    # faktisch bei einem Lauf je Nacht
    Schachbulle\ContaoWertungsportalBundle\Cron\TurnierVorlader:
        tags:
            - { name: contao.cronjob, interval: '*/10 1-3 * * *' }

    # Räumt täglich die Arbeitsablagen weg (Zähler der Besucherbremse).
    # Nachts um vier, wenn der Vorlader fertig ist
    Schachbulle\ContaoWertungsportalBundle\Cron\Aufraeumer:
        tags:
            - { name: contao.cronjob, interval: '0 4 * * *' }

    # Stößt das Vorladen von Hand an: wertungsportal:vorladen.
    # Nötig, weil contao:cron nur ausführt, was nach Zeitplan fällig ist — und
    # weil der Cronjob selbst schweigt, während dieser Befehl jeden Fehlschlag
    # samt Grund auf der Kommandozeile zeigt.
    # Ausdrücklich getaggt, weil dieses Bundle ohne Autoconfigure arbeitet
    Schachbulle\ContaoWertungsportalBundle\Command\VorladenCommand:
        arguments:
            - '@contao.framework'
        tags:
            - { name: console.command }

    # Zeigt, ob das Zugangstoken richtig zwischengespeichert wird:
    # wertungsportal:token. Fragt von sich aus NICHTS bei nu an
    Schachbulle\ContaoWertungsportalBundle\Command\TokenCommand:
        arguments:
            - '@contao.framework'
        tags:
            - { name: console.command }

    # Lädt die DWZ-Listen aller Landesverbände: wertungsportal:download.
    # Ersetzt das frühere Skript Wertungsportal_Download.php, das der Hoster
    # per Curl über eine URL aufgerufen hat — dieser Weg über
    # system/initialize.php gibt es in Contao 5 nicht mehr
    Schachbulle\ContaoWertungsportalBundle\Command\DownloadCommand:
        arguments:
            - '@contao.framework'
        tags:
            - { name: console.command }

    # Erzeugt die CSV-Archive der Landesverbände: wertungsportal:converter.
    # Ersetzt das frühere Skript Wertungsportal_Converter.php (siehe oben)
    Schachbulle\ContaoWertungsportalBundle\Command\ConverterCommand:
        arguments:
            - '@contao.framework'
        tags:
            - { name: console.command }

    # Erzeugt die Hintergrunddateien für Swiss-Chess aus der Deutschland-Datei:
    # wertungsportal:swisschess. Läuft sinnvollerweise NACH dem Converter,
    # weil er dessen export/csv/LV-0-csv.zip benutzt
    Schachbulle\ContaoWertungsportalBundle\Command\SwissChessCommand:
        arguments:
            - '@contao.framework'
        tags:
            - { name: console.command }

    # Füllt die Suchalias-Felder des Bestands beim contao:migrate.
    # Ausdrücklich registriert, weil dieses Bundle ohne Autoconfigure arbeitet
    Schachbulle\ContaoWertungsportalBundle\Migration\AliasMigration:
        arguments:
            - '@database_connection'
        tags:
            - { name: contao.migration }

    # Hier stand ein _instanceof-Block, der FrameworkAwareInterface und
    # ContainerAwareInterface bedient hat. Er ist ersatzlos entfallen:
    #
    # 1. Keine Klasse dieses Bundles hat je eine der beiden Schnittstellen
    #    umgesetzt — der Block war von Anfang an wirkungslos.
    # 2. ContainerAwareInterface gibt es in Symfony 7 nicht mehr, und Contao
    #    5.7 baut darauf auf. Ein Verweis darauf laesst den Container gar
    #    nicht mehr bauen: Das Backend antwortet dann mit einem Fehler, ohne
    #    dass irgendetwas auf dieses Bundle zeigt.
