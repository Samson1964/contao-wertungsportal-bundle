services:
    # Öffentliche Schnittstelle für Vereinslisten (Route in routing.yml).
    # Muß öffentlich sein, damit der Router den Controller auflösen kann
    Schachbulle\ContaoWertungsportalBundle\Controller\VereinslisteController:
        public: true
        arguments:
            - '@contao.framework'

    # Nächtlicher Cronjob: lädt Turnierdaten der letzten Wochen vor, damit
    # nicht jeder erste Besucher auf die Schnittstelle warten muss.
    # Alle 5 Minuten zwischen 1 und 3 Uhr; jeder Lauf macht dort weiter, wo
    # der vorige aufgehört hat. Der Lauf um 3:00 ist der letzte der Nacht —
    # die Termine bis 3:55 lehnt die Klasse selbst ab (STUNDE_ENDE).
    # ACHTUNG: Ohne einen echten Cronjob beim Hoster (contao:cron alle 5
    # Minuten) löst nur ein Seitenaufruf den Termin aus — dann bleibt es
    # faktisch bei einem Lauf je Nacht
    Schachbulle\ContaoWertungsportalBundle\Cron\TurnierVorlader:
        tags:
            - { name: contao.cronjob, interval: '*/5 1-3 * * *' }

    # Räumt täglich die Arbeitsablagen weg (Zähler der Besucherbremse).
    # Nachts um vier, wenn der Vorlader fertig ist
    Schachbulle\ContaoWertungsportalBundle\Cron\Aufraeumer:
        tags:
            - { name: contao.cronjob, interval: '0 4 * * *' }

    # Füllt die Suchalias-Felder des Bestands beim contao:migrate.
    # Ausdrücklich registriert, weil dieses Bundle ohne Autoconfigure arbeitet
    Schachbulle\ContaoWertungsportalBundle\Migration\AliasMigration:
        arguments:
            - '@database_connection'
        tags:
            - { name: contao.migration }

    _instanceof:
        Contao\CoreBundle\Framework\FrameworkAwareInterface:
            calls:
                - ["setFramework", ["@contao.framework"]]

        Symfony\Component\DependencyInjection\ContainerAwareInterface:
            calls:
                - ["setContainer", ["@service_container"]]
